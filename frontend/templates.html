<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Templates — JB Printful Creator</title>
<link rel="stylesheet" href="styles.css">
<style>
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tpl-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tpl-card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--panel-2); display: block; }
  .tpl-card .meta { padding: 12px; }
  .tpl-card .name { font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 36px; }
  .tpl-card .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .tpl-card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tpl-card .actions select, .tpl-card .actions button { font-size: 12px; padding: 5px 8px; }
  .tpl-card .actions .primary { background: var(--accent); color: #001b14; border-color: var(--accent); font-weight: 600; }
  .tpl-card .actions .danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .tpl-card .status { margin-top: 6px; font-size: 11px; min-height: 14px; }
  .tpl-card .status.ok { color: var(--ok); }
  .tpl-card .status.err { color: var(--danger); }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">JB&nbsp;Printful</a>
  <div class="topnav-links">
    <a href="create.html">Create</a>
    <a href="templates.html" class="active">Templates</a>
    <a href="drops.html">Drops</a>
    <a href="shop.html">Shop</a>
  </div>
  <span id="auth-status" class="muted"></span>
</nav>

<section id="login" class="card">
  <h2>Sign in</h2>
  <label>Password <input id="password" type="password" autofocus></label>
  <button id="login-btn">Sign in</button>
  <div id="login-msg" class="msg"></div>
</section>

<main id="app" hidden>
  <p class="muted" style="margin:0 0 16px;">Templates are saved configurations not on any storefront. Publish to push to a real store.</p>
  <div id="grid" class="tpl-grid"></div>
</main>

<script src="templates.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JB Printful Creator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>JB Printful Creator</h1>
  <div id="auth-status" class="muted"></div>
</header>

<section id="login" class="card">
  <h2>Sign in</h2>
  <p class="muted">Backend URL and shared password.</p>
  <label>Backend URL <input id="backend-url" placeholder="https://jb-printful-api-...run.app"></label>
  <label>Password <input id="password" type="password"></label>
  <button id="login-btn">Connect</button>
  <div id="login-msg" class="msg"></div>
</section>

<main id="app" hidden>
  <nav class="steps">
    <button data-step="products" class="active">1. Products</button>
    <button data-step="patterns">2. Patterns</button>
    <button data-step="review">3. Review</button>
    <button data-step="run">4. Run</button>
  </nav>

  <section id="step-products" class="step active">
    <div class="bar">
      <input id="catalog-search" placeholder="Search catalog (e.g. tee, hoodie, mug)" />
      <span class="muted"><span id="catalog-count">0</span> products · <span id="selected-count">0</span> selected</span>
    </div>
    <div id="catalog-grid" class="grid"></div>
  </section>

  <section id="step-patterns" class="step">
    <p class="muted">Upload 1–3 patterns. Each becomes one product per selected blank (e.g. 3 patterns × 5 products = 15 listings).</p>
    <div id="pattern-slots" class="patterns"></div>
  </section>

  <section id="step-review" class="step">
    <div id="review-summary"></div>
    <div id="wrap-prompts"></div>
    <button id="start-btn" class="primary">Create products</button>
  </section>

  <section id="step-run" class="step">
    <div id="progress"></div>
    <div id="results"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JBD Gear — Employee Shop</title>
<link rel="stylesheet" href="styles.css">
<style>
  .shop-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .shop-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color 0.12s; }
  .shop-card:hover { border-color:var(--accent); }
  .shop-card img { width:100%; aspect-ratio:1; object-fit:cover; background:var(--panel-2); }
  .shop-card .meta { padding:10px 12px; }
  .shop-card .name { font-size:13px; font-weight:600; line-height:1.3; }
  .shop-card .price { color:var(--muted); font-size:11px; margin-top:4px; }

  .cart-btn { background:var(--panel-2); border:1px solid var(--line); color:var(--fg); border-radius:18px; padding:6px 14px; cursor:pointer; font:inherit; }
  .cart-btn:hover { border-color:var(--accent); color:var(--accent); }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:100; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; max-width:640px; width:100%; }
  .modal h2 { margin:0 0 8px; font-size:18px; }
  .modal img { max-width:200px; float:right; border-radius:6px; margin:0 0 8px 12px; }
  .modal label { display:block; margin:12px 0 4px; font-size:12px; color:var(--muted); }
  .modal input, .modal select, .modal textarea { width:100%; padding:8px 10px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--fg); font:inherit; }
  .modal .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal .actions { display:flex; gap:10px; margin-top:20px; }
  .modal .total { font-size:16px; color:var(--accent); margin:8px 0 0; }

  #cart-drawer { position:fixed; inset:0; z-index:200; }
  #cart-drawer .cart-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.6); }
  #cart-drawer .cart-panel { position:absolute; right:0; top:0; bottom:0; width:420px; max-width:100vw; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #cart-drawer header { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
  #cart-drawer header h2 { margin:0; font-size:16px; }
  #cart-close { background:none; border:none; color:var(--fg); font-size:24px; cursor:pointer; }
  #cart-items { flex:1; overflow-y:auto; padding:12px 20px; }
  .cart-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .cart-item img { width:60px; height:60px; object-fit:cover; border-radius:4px; background:var(--panel-2); }
  .cart-item .info { flex:1; min-width:0; font-size:12px; }
  .cart-item .info .name { font-weight:600; line-height:1.2; }
  .cart-item .info .variant { color:var(--muted); margin-top:2px; }
  .cart-item .info .price { color:var(--accent); margin-top:4px; }
  .cart-item .qty-row { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; }
  .cart-item .qty-row button { background:var(--panel-2); border:1px solid var(--line); color:var(--fg); width:24px; height:24px; border-radius:4px; cursor:pointer; }
  .cart-item .remove { background:none; border:none; color:var(--danger); cursor:pointer; padding:0; font-size:11px; margin-left:auto; }
  .cart-footer { padding:16px 20px; border-top:1px solid var(--line); }
  .cart-subtotal { margin-bottom:12px; font-size:14px; color:var(--muted); }
  .cart-subtotal strong { color:var(--fg); font-size:18px; }
  .cart-empty { color:var(--muted); padding:40px 20px; text-align:center; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">JB&nbsp;Printful</a>
  <div class="topnav-links">
    <a href="create.html">Create</a>
    <a href="templates.html">Templates</a>
    <a href="drops.html">Drops</a>
    <a href="shop.html" class="active">Shop</a>
  </div>
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="auth-status" class="muted"></span>
    <button id="cart-btn" class="cart-btn">🛒 <span id="cart-count">0</span></button>
  </div>
</nav>

<section id="login" class="card">
  <h2>Sign in</h2>
  <label>Password <input id="password" type="password" autofocus></label>
  <button id="login-btn">Sign in</button>
  <div id="login-msg" class="msg"></div>
</section>

<main id="app" hidden>
  <p class="muted" style="margin:0 0 16px;">Pick what you want — shipping straight to you. Orders over $150 go to David for approval.</p>
  <div class="bar">
    <input id="search" placeholder="Search products...">
    <span class="muted"><span id="count">0</span> items</span>
  </div>
  <div id="grid" class="shop-grid"></div>
</main>

<div id="modal-host"></div>

<aside id="cart-drawer" hidden>
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-panel">
    <header>
      <h2>Cart</h2>
      <button id="cart-close">×</button>
    </header>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-subtotal">Subtotal: <strong id="cart-subtotal">$0.00</strong></div>
      <button id="checkout-btn" class="primary">Checkout</button>
    </div>
  </div>
</aside>

<script src="shop.js"></script>
</body>
</html>

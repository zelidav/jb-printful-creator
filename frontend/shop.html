<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JBD Gear — Employee Shop</title>
<link rel="stylesheet" href="styles.css">
<style>
  .shop-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:14px; }
  .shop-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:border-color 0.12s; }
  .shop-card:hover { border-color:var(--accent); }
  .shop-card img { width:100%; aspect-ratio:1; object-fit:cover; background:var(--panel-2); }
  .shop-card .meta { padding:10px 12px; }
  .shop-card .name { font-size:13px; font-weight:600; line-height:1.3; }
  .shop-card .price { color:var(--accent); font-size:13px; margin-top:4px; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:100; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:24px; max-width:640px; width:100%; }
  .modal h2 { margin:0 0 8px; font-size:18px; }
  .modal img { max-width:200px; float:right; border-radius:6px; margin:0 0 8px 12px; }
  .modal label { display:block; margin:12px 0 4px; font-size:12px; color:var(--muted); }
  .modal input, .modal select, .modal textarea { width:100%; padding:8px 10px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--fg); font:inherit; }
  .modal .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal .actions { display:flex; gap:10px; margin-top:20px; }
  .modal .total { font-size:16px; color:var(--accent); margin:8px 0 0; }
</style>
</head>
<body>
<header>
  <h1>JBD Gear — Employee Shop</h1>
  <div id="auth-status" class="muted"></div>
</header>

<section id="login" class="card">
  <h2>Sign in</h2>
  <p class="muted">Backend URL and shared password.</p>
  <label>Backend URL <input id="backend-url" placeholder="https://jb-printful-creator-...run.app"></label>
  <label>Password <input id="password" type="password"></label>
  <button id="login-btn">Sign in</button>
  <div id="login-msg" class="msg"></div>
</section>

<main id="app" hidden>
  <p class="muted" style="margin:0 0 16px;">Pick what you want — shipping straight to you. Orders over $150 go to David for approval.</p>
  <div class="bar">
    <input id="search" placeholder="Search products...">
    <span class="muted"><span id="count">0</span> items</span>
  </div>
  <div id="grid" class="shop-grid"></div>
</main>

<div id="modal-host"></div>

<script src="shop.js"></script>
</body>
</html>
